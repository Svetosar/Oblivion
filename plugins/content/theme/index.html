{{define "main"}}
<h1>{{.SiteTitle}}</h1>
{{with .SiteDescription}}<p class="lead" lang="{{$.ContentLang}}">{{.}}</p>{{end}}
{{range .Posts}}<article class="entry" lang="{{$.ContentLang}}">
<h2><a href="/posts/{{.Slug}}">{{.Title}}</a></h2>
<time datetime="{{date .PublishedAt}}">{{date .PublishedAt}}</time>
{{with .Excerpt}}<p>{{.}}</p>{{end}}
</article>
{{else}}<p>{{$.UI.NothingYet}}</p>{{end}}
<nav class="pager">{{if .Newer}}<a href="{{.Newer}}" rel="prev">{{.UI.Newer}}</a>{{end}}{{if .Older}}<a href="{{.Older}}" rel="next">{{.UI.Older}}</a>{{end}}</nav>
{{end}}
